<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>BioWeave UI Prototype</title>
  <style>
    :root {
      color-scheme: dark;
      --host: #0b1116;
      --host-soft: #111a21;
      --panel: #171f25;
      --panel-raised: #1d272e;
      --panel-soft: #202c34;
      --text: #edf3f6;
      --text-2: #c2cdd2;
      --muted: #87959d;
      --line: #33444e;
      --line-soft: #293840;
      --accent: #83c7ef;
      --accent-soft: #203b4b;
      --good: #7bd5ae;
      --warn: #f1be72;
      --danger: #f08e98;
      --panel-border: #42545e;
      --header: #19232a;
      --routebar: #141d23;
      --hover: #1a2830;
      --card: #1a252c;
      --card-selected: #203744;
      --control-surface: #162129;
      --input-bg: #141d23;
      --primary-border: #5f9cc0;
      --danger-border: #774852;
      --indent-line: #465862;
      --radius: 10px;
      --panel-width: 960px;
      --panel-height: 760px;
    }

    body[data-theme="light"], .panel[data-theme="light"] {
      color-scheme: light;
      --host: #cbd6db;
      --host-soft: #d3dfe4;
      --panel: #dbe4e8;
      --panel-raised: #e5ecef;
      --panel-soft: #d3dfe4;
      --text: #1b2a33;
      --text-2: #3c4d56;
      --muted: #61727c;
      --line: #8fa2ac;
      --line-soft: #b9c8cf;
      --accent: #356f91;
      --accent-soft: #c9dde6;
      --good: #2b755d;
      --warn: #86651f;
      --danger: #a44852;
      --panel-border: #7e949f;
      --header: #d4dfe3;
      --routebar: #cbd8de;
      --hover: #d8e5e9;
      --card: #e1e9ec;
      --card-selected: #cbdfe8;
      --control-surface: #d5e1e5;
      --input-bg: #d9e4e8;
      --primary-border: #5b8aa0;
      --danger-border: #a44852;
      --indent-line: #a8bac3;
    }

    body[data-theme="tavern"], .panel[data-theme="tavern"] {
      color-scheme: light dark;
      --host: var(--SmartThemeBlurTintColor, #202a31);
      --host-soft: color-mix(in srgb, var(--SmartThemeBlurTintColor, #202a31) 92%, var(--SmartThemeBodyColor, #e8eef2) 8%);
      --panel: color-mix(in srgb, var(--SmartThemeBlurTintColor, #202a31) 90%, var(--SmartThemeBodyColor, #e8eef2) 10%);
      --panel-raised: color-mix(in srgb, var(--SmartThemeBlurTintColor, #202a31) 82%, var(--SmartThemeBodyColor, #e8eef2) 18%);
      --panel-soft: color-mix(in srgb, var(--SmartThemeBlurTintColor, #202a31) 74%, var(--SmartThemeBodyColor, #e8eef2) 26%);
      --text: var(--SmartThemeBodyColor, #e8eef2);
      --text-2: color-mix(in srgb, var(--SmartThemeBodyColor, #e8eef2) 78%, var(--SmartThemeBlurTintColor, #202a31) 22%);
      --muted: color-mix(in srgb, var(--SmartThemeBodyColor, #e8eef2) 62%, var(--SmartThemeBlurTintColor, #202a31) 38%);
      --line: color-mix(in srgb, var(--SmartThemeBodyColor, #e8eef2) 24%, var(--SmartThemeBlurTintColor, #202a31) 76%);
      --line-soft: color-mix(in srgb, var(--SmartThemeBodyColor, #e8eef2) 16%, var(--SmartThemeBlurTintColor, #202a31) 84%);
      --accent: var(--SmartThemeQuoteColor, #4f91b6);
      --accent-soft: color-mix(in srgb, var(--SmartThemeQuoteColor, #4f91b6) 14%, var(--SmartThemeBlurTintColor, #202a31) 86%);
      --good: #3b8b6d;
      --warn: #a7792b;
      --danger: #b45d67;
      --panel-border: color-mix(in srgb, var(--SmartThemeBodyColor, #e8eef2) 28%, var(--SmartThemeBlurTintColor, #202a31) 72%);
      --header: color-mix(in srgb, var(--SmartThemeBlurTintColor, #202a31) 90%, var(--SmartThemeBodyColor, #e8eef2) 10%);
      --routebar: color-mix(in srgb, var(--SmartThemeBlurTintColor, #202a31) 84%, var(--SmartThemeBodyColor, #10171c) 16%);
      --hover: var(--accent-soft);
      --card: var(--panel-raised);
      --card-selected: var(--accent-soft);
      --control-surface: var(--panel-raised);
      --input-bg: color-mix(in srgb, var(--SmartThemeBlurTintColor, #202a31) 82%, var(--SmartThemeBodyColor, #e8eef2) 18%);
      --primary-border: var(--SmartThemeQuoteColor, #5f9bbd);
      --danger-border: #b45d67;
      --indent-line: var(--line);
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100vh;
      overflow: hidden;
      background:
        radial-gradient(circle at 20% 15%, color-mix(in srgb, var(--accent) 20%, transparent) 0, transparent 34%),
        linear-gradient(140deg, var(--host-soft), var(--host));
      color: var(--text);
      font: 14px/1.5 system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    button, input, select, textarea { font: inherit; color: inherit; }
    button { cursor: pointer; }
    .host { min-height: 100vh; display: grid; place-items: center; padding: 20px; }
    .panel {
      width: min(var(--panel-width), 94vw);
      height: min(var(--panel-height), 90vh);
      min-height: 0;
      display: grid;
      grid-template-rows: 50px 42px minmax(0, 1fr);
      overflow: hidden;
      border: 1px solid var(--panel-border);
      border-radius: 13px;
      background: var(--panel);
      box-shadow: 0 18px 60px rgb(0 0 0 / 42%);
    }

    .app-header {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
      padding: 0 16px;
      border-bottom: 1px solid var(--line);
      background: var(--header);
    }
    .brand { font-size: 16px; font-weight: 700; white-space: nowrap; }
    .scope { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text-2); }
    .scope::before { content: ""; display: inline-block; width: 6px; height: 6px; margin-right: 8px; border-radius: 50%; background: var(--good); vertical-align: 2px; }
    .header-spacer { flex: 1; }
    .header-button, .close-button {
      border: 0;
      background: transparent;
      color: var(--muted);
      padding: 6px 8px;
    }
    .header-button:hover, .close-button:hover { color: var(--text); background: var(--accent-soft); border-radius: 6px; }
    .theme-button { display: grid; place-items: center; width: 32px; height: 32px; padding: 0; font-size: 16px; }
    .theme-icon { display: block; line-height: 1; }
    .close-button { font-size: 18px; line-height: 1; }

    .routebar {
      display: flex;
      align-items: stretch;
      gap: 2px;
      padding: 0 10px;
      overflow-x: auto;
      border-bottom: 1px solid var(--line);
      background: var(--routebar);
    }
    .desktop-route-items { display: flex; align-items: stretch; gap: 2px; }
    .routebar button {
      flex: 0 0 auto;
      min-width: 72px;
      border: 0;
      border-bottom: 2px solid transparent;
      background: transparent;
      color: var(--muted);
      padding: 0 11px;
      font-size: 14px;
      white-space: nowrap;
    }
    .routebar button:hover { color: var(--text); background: var(--hover); }
    .routebar button.active { border-bottom-color: var(--accent); color: var(--accent); }

    .main { min-height: 0; overflow: auto; padding: 16px 18px 20px; }
    .page { max-width: 820px; margin: 0 auto; }
    .page-head { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 12px; padding-left: 4px; }
    .page > .section, .page > .surface, .page > .world-picker, .page > .settings-groups { margin-left: 10px; }
    .page-head-copy { min-width: 0; flex: 1; }
    h1, h2, h3, p { margin: 0; }
    h1 { font-size: 22px; line-height: 1.3; letter-spacing: -.02em; }
    h2 { font-size: 16px; line-height: 1.35; }
    h3 { font-size: 14px; line-height: 1.4; }
    .page-head p, .subtle { margin-top: 4px; color: var(--muted); font-size: 12px; }
    .page-actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 7px; }
    .button {
      min-height: 32px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: var(--panel-raised);
      color: var(--text-2);
      padding: 5px 10px;
    }
    .button:hover { border-color: var(--accent); color: var(--text); }
    .button.primary { border-color: var(--primary-border); background: var(--accent-soft); color: var(--accent); }
    .button.danger { border-color: var(--danger-border); color: var(--danger); }
    .text-button { border: 0; background: transparent; color: var(--accent); padding: 5px 0; }

    .surface { border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel-raised); }
    .surface.pad { padding: 11px 12px; }
    .stat-strip { display: grid; grid-template-columns: repeat(3, 1fr); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; margin-bottom: 8px; }
    .stat { min-width: 0; padding: 8px 10px; background: var(--panel-raised); }
    .stat + .stat { border-left: 1px solid var(--line); }
    .stat strong { display: block; font-size: 20px; color: var(--text); }
    .stat span { color: var(--muted); font-size: 12px; }
    .split { display: grid; grid-template-columns: 1.1fr .9fr; gap: 8px; }
    .section { min-width: 0; padding: 11px 12px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel-raised); }
    .section + .section { margin-top: 8px; }
    .section-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 6px; }
    .section-head p { margin-top: 2px; color: var(--muted); font-size: 12px; }
    .row-list { display: grid; }
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      min-width: 0;
      padding: 6px 0;
      border-top: 1px solid var(--line-soft);
    }
    .row:first-child { border-top: 0; }
    .row-main { min-width: 0; }
    .row-main b, .row-main span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .row .row-main { display: flex; align-items: baseline; gap: 8px; }
    .row .row-main b { flex: 0 0 auto; max-width: 40%; }
    .row .row-main span { min-width: 0; margin-top: 0; color: var(--muted); font-size: 12px; }
    .row-value { flex: 0 0 auto; color: var(--text-2); text-align: right; }
    .row-value.good { box-sizing: border-box; padding-right: 8px; color: var(--good); }
    .row-value.warn { box-sizing: border-box; padding-right: 8px; color: var(--warn); }
    .badge { display: inline-flex; align-items: center; min-height: 22px; padding: 2px 7px; border: 1px solid var(--line); border-radius: 999px; color: var(--text-2); font-size: 12px; white-space: nowrap; }
    .badge.good { border-color: #426e5a; color: var(--good); }
    .badge.warn { border-color: #765d38; color: var(--warn); }
    .badge.danger { border-color: #75434b; color: var(--danger); }
    .empty { display: grid; place-items: center; min-height: 160px; padding: 20px; text-align: center; color: var(--muted); }
    .empty strong { display: block; margin-bottom: 5px; color: var(--text-2); font-size: 15px; }

    .character-list, .event-list, .task-list { display: grid; gap: 4px; }
    .entity-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%; min-width: 0; padding: 7px 9px; border: 1px solid var(--line-soft); border-radius: 8px; background: var(--card); }
    .entity-row:hover { border-color: var(--accent); }
    .entity-copy { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
    .entity-copy b { flex: 0 0 auto; }
    .entity-copy small { min-width: 0; margin-top: 0; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .event-row { display: grid; grid-template-columns: 122px minmax(0, 1fr) auto; gap: 8px; align-items: center; min-width: 0; padding: 6px 0; border-top: 1px solid var(--line-soft); }
    .event-row:first-child { border-top: 0; }
    .event-time { overflow: hidden; color: var(--muted); font-size: 12px; text-overflow: ellipsis; white-space: nowrap; }
    .event-copy { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
    .event-copy b { flex: 0 0 auto; }
    .event-copy p { min-width: 0; margin-top: 0; color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .world-selects { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
    .world-picker { margin-bottom: 8px; padding: 10px 11px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel-raised); }
    .world-picker-head, .type-picker-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .world-picker-head { margin-bottom: 5px; }
    .world-picker-head p, .type-picker-head p { margin-top: 2px; color: var(--muted); font-size: 12px; }
    .species-grid, .type-grid { display: grid; gap: 8px; }
    .species-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .type-grid { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); margin-top: 4px; }
    .world-card, .type-card { min-width: 0; border: 1px solid var(--line-soft); border-radius: 9px; background: var(--card); color: var(--text); text-align: left; transition: border-color .15s, background .15s; }
    .world-card { min-height: 72px; padding: 10px 12px; }
    .type-card { min-height: 56px; padding: 8px 10px; }
    .world-card:hover, .type-card:hover { border-color: var(--accent); }
    .world-card.selected, .type-card.selected { border-color: var(--accent); background: var(--card-selected); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 20%, transparent); }
    .world-card-head, .type-card-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
    .world-card b { display: block; overflow: hidden; color: var(--text); font-size: 15px; font-weight: 700; line-height: 1.25; text-overflow: ellipsis; white-space: nowrap; }
    .type-card b { display: block; overflow: hidden; color: var(--text-2); font-size: 15px; font-weight: 650; line-height: 1.25; text-overflow: ellipsis; white-space: nowrap; }
    .world-card small, .type-card small { display: block; margin-top: 4px; color: var(--muted); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .world-card-mark { color: var(--accent); font-size: 11px; }
    .type-picker-head { margin-top: 5px; padding-top: 5px; border-top: 1px solid var(--line-soft); }
    .type-picker-head h3 { color: var(--text-2); font-size: 13px; }
    .field { display: grid; gap: 5px; color: var(--muted); font-size: 12px; }
    select, input, textarea { width: 100%; border: 1px solid var(--line); border-radius: 7px; background: var(--input-bg); padding: 8px 9px; }
    .settings-group select, .settings-group select option { font-size: 11px; }
    .settings-group select { padding: 5px 7px; }
    .world-title { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; padding-bottom: 9px; border-bottom: 1px solid var(--line); }
    .world-title b { display: block; font-size: 18px; }
    .world-title p { margin-top: 3px; color: var(--muted); font-size: 12px; }
    .world-content-grid { display: grid; grid-template-columns: minmax(0, 6fr) minmax(0, 4fr); gap: 8px; padding-top: 2px; }
    .world-detail-column, .world-rules-column { min-width: 0; }
    .world-rules-column > .surface { height: 100%; }
    .world-detail-list { display: grid; padding-top: 2px; }
    .world-module { padding: 8px 0; border-bottom: 1px solid var(--line-soft); }
    .world-module:last-child { border-bottom: 0; }
    .world-module-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
    .world-module-head h3 { color: var(--text-2); font-size: 14px; }
    .world-module-head small { max-width: 42%; overflow: hidden; color: var(--muted); font-size: 11px; text-overflow: ellipsis; white-space: nowrap; }
    .world-module-body { margin-top: 3px; }
    .kv { display: grid; }
    .kv div { display: grid; grid-template-columns: minmax(118px, max-content) minmax(0, 1fr); gap: 6px; padding: 5px 0; border-top: 1px solid var(--line-soft); }
    .world-rules-column .kv div { grid-template-columns: minmax(92px, max-content) minmax(0, 1fr); gap: 5px; }
    .kv dt { color: var(--text-2); }
    .kv dd { margin: 0; color: var(--muted); text-align: left; }
    .compact-note { display: flex; align-items: flex-start; gap: 8px; padding: 7px 0 0; color: var(--muted); font-size: 12px; }
    .compact-note strong { color: var(--warn); }
    .edit-panel { margin: 8px 0 2px; padding: 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); }
    .world-card-editor { display: grid; gap: 10px; }
    .world-editor-block { padding-top: 9px; border-top: 1px solid var(--line-soft); }
    .world-editor-block h3 { margin-bottom: 5px; color: var(--text-2); font-size: 13px; }
    .edit-hint { margin-bottom: 8px; color: var(--muted); font-size: 12px; }
    .check-list, .control-list { display: grid; gap: 1px; }
    .check-row, .control-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 38px; padding: 7px 0; border-top: 1px solid var(--line-soft); }
    .check-row:first-child, .control-row:first-child { border-top: 0; }
    .check-copy { min-width: 0; }
    .check-copy b, .check-copy small { display: block; }
    .check-copy small { margin-top: 2px; color: var(--muted); font-size: 11px; }
    .check-row input { width: 16px; height: 16px; flex: 0 0 auto; accent-color: var(--accent); }
    .switch { position: relative; display: inline-flex; flex: 0 0 auto; align-items: center; cursor: pointer; }
    .switch input { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
    .switch-track { display: inline-flex; align-items: center; width: 36px; height: 21px; padding: 2px; border: 1px solid var(--line); border-radius: 999px; background: var(--control-surface); transition: background .15s, border-color .15s; }
    .switch-thumb { width: 15px; height: 15px; border-radius: 50%; background: var(--muted); transition: transform .15s, background .15s; }
    .switch input:checked + .switch-track { border-color: var(--primary-border); background: var(--accent-soft); }
    .switch input:checked + .switch-track .switch-thumb { background: var(--accent); transform: none; }
    .inline-actions { display: flex; justify-content: flex-end; gap: 7px; margin-top: 10px; }
    .edit-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
    .edit-grid .full { grid-column: 1 / -1; }
    .status-note { margin-left: auto; color: var(--good); font-size: 11px; }

    .settings-list { display: grid; gap: 7px; }
    .settings-item { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 13px; border: 1px solid var(--line-soft); border-radius: 8px; background: var(--card); }
    .settings-item p { margin-top: 3px; color: var(--muted); font-size: 12px; }
    .settings-item.active { border-color: var(--accent); }
    .field-inline { display: flex; align-items: center; gap: 7px; color: var(--muted); font-size: 12px; }
    .field-inline select { width: auto; min-width: 82px; padding: 5px 7px; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
    .form-grid .full { grid-column: 1 / -1; }
    .settings-groups { display: grid; gap: 3px; }
    .settings-group { overflow: hidden; border: 1px solid var(--line-soft); border-radius: var(--radius); background: var(--panel); }
    .settings-group-head { display: flex; align-items: center; gap: 8px; min-height: 56px; padding: 7px 12px; background: var(--header); }
    .settings-group-head > .badge { flex: 0 0 auto; }
    .settings-group.expanded .settings-group-head { border-left: 3px solid var(--accent); background: var(--card-selected); padding-left: 9px; }
    .settings-toggle { display: flex; align-items: center; flex: 1; gap: 9px; min-width: 0; border: 0; background: transparent; color: var(--text); text-align: left; }
    .settings-toggle:hover { color: var(--accent); }
    .settings-chevron { display: grid; place-items: center; width: 18px; height: 18px; border: 1px solid var(--line); border-radius: 5px; color: var(--accent); font-size: 15px; line-height: 1; }
    .settings-toggle-copy { min-width: 0; }
    .settings-toggle-copy b, .settings-toggle-copy small { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .settings-toggle-copy b { font-size: 15px; line-height: 1.35; }
    .settings-toggle-copy small { margin-top: 3px; color: var(--muted); font-size: 11px; }
    .settings-group-body { padding: 0 13px 12px; border-top: 1px solid var(--line); background: var(--panel-raised); }
    .settings-group-body .field, .settings-group-body .setting-grid, .settings-group-body select { min-width: 0; }
    .setting-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; padding-top: 11px; }
    .recent-story-read-options { align-items: center; }
    .setting-grid .full { grid-column: 1 / -1; }
    .setting-note { margin-top: 9px; color: var(--muted); font-size: 11px; }
    .settings-group .control-list, .settings-group .check-list { padding-top: 4px; }
    .settings-group .check-list { grid-template-columns: 1fr 1fr; column-gap: 16px; }
    .settings-group .check-row:nth-child(2) { border-top: 0; }
    .settings-group .check-row:nth-child(3), .settings-group .check-row:nth-child(4) { border-top: 1px solid var(--line-soft); }
    .settings-summary-line { display: flex; flex-wrap: wrap; align-items: center; gap: 7px 12px; padding: 10px 0 3px; color: var(--muted); font-size: 12px; }
    .settings-summary-line strong { color: var(--text-2); }
    .settings-toolbar { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 9px; padding-top: 11px; }
    .settings-toolbar .field { min-width: 180px; flex: 1; }
    .settings-toolbar-actions, .settings-actions { display: flex; flex-wrap: wrap; gap: 7px; }

      document.body.dataset.theme = theme;
      document.querySelector('.panel')?.setAttribute('data-theme', theme);
      const button = document.querySelector('.theme-button');
      const meta = themeMeta[theme];
      const icon = button?.querySelector('[data-theme-icon]');
      if (icon) icon.textContent = meta.symbol;
      button?.setAttribute('title', `主题：${meta.label}（点击切换）`);
      button?.setAttribute('aria-label', `主题：${meta.label}，点击切换`);
    }

"button" type="button" data-setting-profile-refresh>刷新模型</button></div><p class="profile-status">${escapeHtml(apiProfile.status)}</p></div>` : '';
      const apiBody = `<div class="radio-list"><label class="radio-option"><input type="radio" name="api_source" value="sillytavern_current_api" data-setting-api-source ${state.settings.apiSource === 'sillytavern_current_api' ? 'checked' : ''}><span><strong>使用 SillyTavern 当前 API</strong><small>沿用酒馆当前连接，不复制或读取 API Key。</small></span></label><label class="radio-option"><input type="radio" name="api_source" value="bioweave_independent_api" data-setting-api-source ${state.settings.apiSource === 'bioweave_independent_api' ? 'checked' : ''}><span><strong>使用 BioWeave 独立 API</strong><small>为“跟随默认”的任务提供独立连接。</small></span></label></div><div class="setting-grid"><label class="field">超时（秒）<select data-setting-timeout><option ${state.settings.timeout === '60 秒' ? 'selected' : ''}>60 秒</option><option ${state.settings.timeout === '180 秒' ? 'selected' : ''}>180 秒</option><option ${state.settings.timeout === '300 秒' ? 'selected' : ''}>300 秒</option></select></label><label class="field">重试次数<select data-setting-retry><option ${state.settings.retryCount === '0' ? 'selected' : ''}>0</option><option ${state.settings.retryCount === '1' ? 'selected' : ''}>1</option><option ${state.settings.retryCount === '2' ? 'selected' : ''}>2</option><option ${state.settings.retryCount === '3' ? 'selected' : ''}>3</option></select></label></div>${state.settings.apiSource === 'bioweave_independent_api' ? apiProfileBody : ''}<p class="setting-note">安全：独立 API Key 只写入 SillyTavern Secret Store；BioWeave 不读取、复制或显示酒馆当前 API 的密钥。</p>`;

        <section class="section"><div class="section-head"><div><h2>安全摘要</h2><p>仅展示脱敏后的错误分类和阶段信息</p></div></div><div class="row"><div class="row-main"><b>Secret Store</b><span>API Key 不进入 Chat metadata、Floor extra 或预览</span></div><span class="row-value good">正常</span></div><div class="row"><div class="row-main"><b>当前 Chat Scope</b><span>异步结果仅允许写回当前 Chat</span></div><span class="row-value good">正常</span></div></section>

    function render() {

      renderNav();

      document.querySelector('#main').innerHTML = pages[state.route]();

      document.querySelectorAll('[data-route]').forEach(button => button.addEventListener('click', () => { state.route = button.dataset.route; updateUrl(); render(); }));

        }
        state.worldEdit = null;
        render();
      }));
      document.querySelectorAll('[data-world-species-card]').forEach(button => button.addEventListener('click', () => {

        state.worldEdit = null;
        render();
      }));
      document.querySelectorAll('[data-world-type-card]').forEach(button => button.addEventListener('click', () => {
        state.worldType = button.dataset.worldTypeCard;
        state.worldEdit = null;

      document.querySelectorAll('[data-event-filter]').forEach(select => select.addEventListener('change', event => { state.eventFilter = event.target.value; render(); }));

          state.settings.worldbookSelection[branchKey] = event.target.checked;
          branch?.children.forEach(([childKey]) => { state.settings.worldbookChildren[branchKey][childKey] = event.target.checked; });
          render();
        });
      });
      document.querySelectorAll('[data-setting-source-child]').forEach(input => input.addEventListener('change', event => {
        const branchKey = event.target.dataset.settingSourceBranch;
        const branch = worldbookSourceBranches.find(item => item.key === branchKey);
        state.settings.worldbookChildren[branchKey][event.target.dataset.settingSourceChild] = event.target.checked;
        state.settings.worldbookSelection[branchKey] = branch?.children.some(([childKey]) => state.settings.worldbookChildren[branchKey][childKey]) || false;
        render();
      }));
      document.querySelectorAll('[data-setting-source-parent]').forEach(input => {
        const branch = worldbookSourceBranches.find(item => item.key === input.dataset.settingSourceParent);
        const childState = state.settings.worldbookChildren[input.dataset.settingSourceParent] || {};
        const selectedChildren = branch?.children.filter(([childKey]) => childState[childKey]).length || 0;
        input.indeterminate = selectedChildren > 0 && selectedChildren < (branch?.children.length || 0);
        input.setAttribute('aria-checked', input.indeterminate ? 'mixed' : String(input.checked));
      });
      document.querySelector('[data-setting-source-all]')?.addEventListener('click', () => { worldbookSourceBranches.forEach(branch => { state.settings.worldbookSelection[branch.key] = true; branch.children.forEach(([childKey]) => { state.settings.worldbookChildren[branch.key][childKey] = true; }); }); render(); });

      document.querySelectorAll('[data-setting-regex-move]').forEach(button => button.addEventListener('click', () => { const list = state.settings[button.dataset.settingRegexScope === 'global' ? 'globalRegex' : 'characterRegex']; const index = Number(button.dataset.settingRegexIndex); const next = button.dataset.settingRegexMove === 'up' ? index - 1 : index + 1; if (next < 0 || next >= list.length) return; [list[index], list[next]] = [list[next], list[index]]; render(); }));

      document.querySelector('[data-setting-profile-refresh]')?.addEventListener('click', () => { state.settings.apiProfile.models = ['当前宿主模型', 'gpt-4o-mini', 'claude-3.5-sonnet']; state.settings.apiProfile.status = '模型列表已刷新（示意）'; render(); });
      document.querySelectorAll('[data-setting-assignment]').forEach(select => select.addEventListener('change', event => { state.settings.assignments[event.target.dataset.settingAssignment] = event.target.value; render(); }));
      document.querySelectorAll('[data-setting-timeout]').forEach(select => select.addEventListener('change', event => { state.settings.timeout = event.target.value; render(); }));
      document.querySelectorAll('[data-setting-retry]').forEach(select => select.addEventListener('change', event => { state.settings.retryCount = event.target.value; render(); }));
      document.querySelectorAll('[data-setting-recent-count]').forEach(input => input.addEventListener('change', event => { state.settings.recentStoryCount = event.target.value; render(); }));
      document.querySelectorAll('[data-setting-prompt]').forEach(input => input.addEventListener('change', event => { state.settings.prompt[event.target.dataset.settingPrompt] = event.target.value; render(); }));
      document.querySelectorAll('[data-setting-preview-mode]').forEach(button => button.addEventListener('click', () => { state.settings.previewMode = button.dataset.settingPreviewMode; render(); }));
      document.querySelectorAll('[data-setting-source-toggle]').forEach(header => {
        const toggle = () => {
          const key = header.dataset.settingSourceToggle;
          state.settings.worldbookExpanded[key] = !state.settings.worldbookExpanded[key];
          render();
        };
        header.addEventListener('click', event => {
          if (event.target.closest?.('[data-setting-source-parent]')) return;
          toggle();
        });
        header.addEventListener('keydown', event => {
          if (event.key === 'Enter' || event.key === ' ') {
            event.preventDefault();
            toggle();
          }
        });
      });
      document.querySelectorAll('[data-settings-toggle]').forEach(button => button.addEventListener('click', () => { const key = button.dataset.settingsToggle; state.settingsExpanded[key] = !state.settingsExpanded[key]; render(); }));
      const themeButton = document.querySelector('.theme-button');
      if (themeButton) themeButton.onclick = () => {
        const values = ['tavern', 'light', 'dark'];
        state.theme = values[(values.indexOf(state.theme) + 1) % values.length];
        updateUrl();
        render();
      };
    }

    document.querySelectorAll('.prototype-bar button').forEach(button => button.addEventListener('click', () => { state.device = button.dataset.device; updateUrl(); render(); }));
    render();
  </script>
</body>
</html>
