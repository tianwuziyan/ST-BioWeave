<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>BioWeave 生产 UI · 妊娠状态预览</title>
    <link rel="stylesheet" href="../../../style.css">
    <style>
      /* 妊娠增量只使用生产 token；shell、页面结构和既有组件来自生产代码。 */
      .bioweave-character-state-strip.bioweave-pregnancy-state-strip { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .bioweave-pregnancy-conception-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
      .bioweave-pregnancy-conception-head > span { display: block; }
      .bioweave-main .bioweave-pregnancy-knowledge-button { min-height: 25px !important; padding: 2px 7px !important; border: 1px solid var(--bioweave-accent) !important; border-radius: 7px !important; color: var(--bioweave-accent) !important; background: var(--bioweave-accent-soft) !important; font-size: 10px !important; line-height: 1.35 !important; white-space: nowrap; }
      .bioweave-main .bioweave-pregnancy-knowledge-button:hover,
      .bioweave-main .bioweave-pregnancy-knowledge-button:focus-visible { border-color: var(--bioweave-text) !important; color: var(--bioweave-text) !important; background: var(--bioweave-surface-raised) !important; }
      .bioweave-pregnancy-conception-value { margin-top: 4px; }
    </style>
  </head>
  <body>
    <div id="bioweave-overlay" class="bioweave-overlay" data-open="true" aria-hidden="false">
      <section id="bioweave-panel" class="bioweave-root bioweave-panel" data-open="true" data-theme="tavern" role="dialog" aria-modal="true" aria-hidden="false">
        <header class="bioweave-app-header" data-bioweave-drag-handle>
          <strong class="bioweave-brand">BioWeave</strong>
          <span class="bioweave-chat-scope bioweave-muted">当前 Chat</span>
          <span class="bioweave-spacer"></span>
          <label class="bioweave-theme-button bioweave-enabled-control" data-bioweave-action="toggle-bioweave-enabled" data-bioweave-enabled-toggle data-bioweave-tooltip="暂停 BioWeave" title="暂停 BioWeave" aria-label="暂停 BioWeave"><input class="bioweave-checkbox" type="checkbox" data-bioweave-enabled-input checked aria-label="暂停 BioWeave"><span data-bioweave-enabled-label>已开启</span><span class="bioweave-header-tooltip" data-bioweave-header-tooltip role="tooltip">暂停 BioWeave</span></label>
          <button class="bioweave-theme-button" type="button" data-bioweave-action="cycle-theme" data-bioweave-theme-button data-bioweave-tooltip="切换皮肤：跟随酒馆" title="切换皮肤：跟随酒馆" aria-label="切换皮肤：跟随酒馆"><i class="fa-solid fa-circle-half-stroke" data-bioweave-theme-icon aria-hidden="true"></i><span class="bioweave-header-tooltip" data-bioweave-header-tooltip role="tooltip">切换皮肤：跟随酒馆</span></button>
          <button class="bioweave-floating-toggle" type="button" data-bioweave-action="toggle-floating-launcher" data-bioweave-floating-toggle data-bioweave-tooltip="关闭悬浮窗"><svg class="bioweave-floating-toggle-icon" viewBox="0 0 48 48" aria-hidden="true" focusable="false"><circle cx="24" cy="24" r="6"></circle><path d="M 10 27 A 15 15 0 0 1 30 10"></path><path d="M 38 21 A 15 15 0 0 1 18 38"></path><circle cx="34" cy="14" r="3.5"></circle><circle cx="14" cy="34" r="3.5"></circle></svg><span class="bioweave-header-tooltip" data-bioweave-header-tooltip role="tooltip">关闭悬浮窗</span></button>
          <button class="bioweave-close" type="button" data-bioweave-action="close" aria-label="关闭 BioWeave">×</button>
        </header>
        <nav class="bioweave-routebar" aria-label="BioWeave 页面导航"><div class="bioweave-route-items"></div></nav><main class="bioweave-main"></main>
      </section>
    </div>
    <script>
      // file:// 环境会阻止 ES Module 跨文件读取；直接打开时转到无模块依赖的同源预览。
      if (location.protocol === 'file:') location.replace('pregnancy-status-ui-addition-real-ui-standalone.html')
    </script>
    <script type="module">
      import {overviewPage} from '../../../ui/overview.js'
      import {charactersPage} from '../../../ui/characters.js'
      import {projectionPage} from '../../../ui/projection.js'
      const routes = [['overview','总览','fa-house'],['characters','人物','fa-user-group'],['events','事件','fa-calendar-days'],['projection','推演','fa-wand-magic-sparkles'],['genealogy','家系','fa-diagram-project'],['world','世界','fa-shapes'],['settings','设置','fa-gear'],['state','状态','fa-chart-line']]
      const subjects = [{character_id:'char_000001',display_name:'柳如烟',status:'active',exposure_event_ids:['event_001']},{character_id:'char_000002',display_name:'祁鸢',status:'active',exposure_event_ids:['event_001','event_002']},{character_id:'char_000003',display_name:'孙大壮',status:'active',exposure_event_ids:['event_001']}]
      const profiles = {char_000001:{character_id:'char_000001',display_name:'柳如烟',species:'人类',biological_type:'女性',reproductive_capabilities:{can_produce_sperm:false,can_produce_ova:true,can_fertilize:false,can_be_fertilized:true,can_carry_pregnancy:true,can_cause_pregnancy:false}},char_000002:{character_id:'char_000002',display_name:'祁鸢',species:'人类',biological_type:'女性',reproductive_capabilities:{can_produce_sperm:false,can_produce_ova:true,can_fertilize:false,can_be_fertilized:true,can_carry_pregnancy:true,can_cause_pregnancy:false}},char_000003:{character_id:'char_000003',display_name:'孙大壮',species:'人类',biological_type:'男性',reproductive_capabilities:{can_produce_sperm:true,can_produce_ova:false,can_fertilize:true,can_be_fertilized:false,can_carry_pregnancy:false,can_cause_pregnancy:true}}}
      const pregnancy = {char_000001:{status:'suspected',label:'疑似 / 观察中',gestationLabel:'观察中',known:[]},char_000002:{status:'confirmed',label:'已确认怀孕',gestational_weeks:8,gestationLabel:'孕 8 周',known:['柳如烟','觉心']},char_000003:{status:'unknown',label:'暂无结论',gestationLabel:'暂无结论',known:[]}}
      const events = [{event_id:'event_001',type:'pregnancy_suspicion',status:'probable',story_time:{day:12}},{event_id:'event_002',type:'pregnancy_confirmation',status:'confirmed',story_time:{day:14}}]
      const projections = [{id:'projection_001',subject:{id:'char_000001'},status:'active',rule:{label:'恶心',description:'可能出现需要观察的身体反应',observation_stage:{key:'stage_1',label:'初期观察',phase:'观察中',min_elapsed_story_days:0,max_elapsed_story_days:30,branches:[{key:'b1',label:'就医检查'}]}},observed_reaction:{matched:true},timing:{current_story_time:{day:12},reference_story_time:{day:0},observation_stage_key:'stage_1'}}]
      const snapshots = [{subject_id:'char_000001',status:'candidates',branches:[{title:'检查契机',premise:'身体不适引出检查',nodes:[{title:'节点一',objective:'自然进入检查场景',completion_signal:'出现检查机会',conclusion_goal:'获得进一步线索'},{title:'节点二',objective:'完成相关检查',completion_signal:'检查结果出现',conclusion_goal:'推进事实判断'},{title:'节点三',objective:'根据结果继续剧情',completion_signal:'结果被合理知晓',conclusion_goal:'进入结算'}]},{title:'意外就医',premise:'突发状况带来检查',nodes:[{title:'节点一',objective:'突发事故后接受处理',completion_signal:'进入医疗场景',conclusion_goal:'获得检查条件'},{title:'节点二',objective:'医生进行常规检查',completion_signal:'检查中出现线索',conclusion_goal:'推进事实判断'},{title:'节点三',objective:'相关人物获知结果',completion_signal:'结果合理传播',conclusion_goal:'进入结算'}]},{title:'他人察觉',premise:'身边人物发现异常',nodes:[{title:'节点一',objective:'他人注意到异常表现',completion_signal:'提出自然询问',conclusion_goal:'形成就医建议'},{title:'节点二',objective:'陪同或建议检查',completion_signal:'检查安排成立',conclusion_goal:'推进事实判断'},{title:'节点三',objective:'结果通过合理渠道揭示',completion_signal:'事实逐步明确',conclusion_goal:'进入结算'}]}]}]
      const state = {route:'overview',characterId:'char_000001',projectionId:'char_000001',openKnowledge:false}
      const panel = document.querySelector('#bioweave-panel'), main = document.querySelector('.bioweave-main')
      const esc = value => String(value ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))
      const statusTone = status => status === 'confirmed' ? 'good' : status === 'suspected' ? 'warn' : ''
      function addCharacterState(id) { const item=pregnancy[id], section=main.querySelector('.bioweave-character-state'); if(!item||!section)return; const confirmed=item.status==='confirmed'; let strip=section.querySelector('.bioweave-character-state-strip'); const stripMarkup='<div class="bioweave-character-state-strip bioweave-pregnancy-state-strip"><div class="bioweave-character-state-cell"><span>生殖暴露</span><strong>已记录</strong></div><div class="bioweave-character-state-cell"><div class="bioweave-pregnancy-conception-head"><span>受孕事实</span>'+(confirmed?'<button type="button" class="bioweave-button bioweave-pregnancy-knowledge-button" data-knowledge="'+id+'" aria-expanded="'+String(state.openKnowledge)+'" aria-controls="bioweave-pregnancy-knowledge-popover" aria-haspopup="dialog">知情名单</button>':'')+'</div><strong class="bioweave-pregnancy-conception-value">'+esc(item.label)+'</strong></div><div class="bioweave-character-state-cell"><span>妊娠状态</span><strong>'+esc(item.gestationLabel || (confirmed && item.gestational_weeks != null ? '孕 '+item.gestational_weeks+' 周' : '暂无结论'))+'</strong></div></div>'; if(!strip){ const empty=section.querySelector('.bioweave-character-state-empty'); if(!empty)return; empty.outerHTML=stripMarkup+'<p class="bioweave-character-state-empty-summary">周期、产后、身体表现、医疗事实暂无记录</p>'; strip=section.querySelector('.bioweave-character-state-strip') } else { strip.outerHTML=stripMarkup; strip=section.querySelector('.bioweave-character-state-strip') } if(confirmed&&state.openKnowledge) section.insertAdjacentHTML('beforeend',knowledgePopoverMarkup(id,item)) }
      function knowledgePopoverMarkup(id,item) { return '<section id="bioweave-pregnancy-knowledge-popover" class="bioweave-card bioweave-character-alias-editor bioweave-character-editor-popover bioweave-compact-popup" role="dialog" aria-modal="true" aria-label="怀孕知情人名单"><div class="bioweave-character-alias-head"><div><h3>怀孕知情人</h3><p>仅显示明确知道该事实的人物</p></div><button type="button" class="bioweave-button bioweave-character-alias-close" data-knowledge="'+id+'" aria-label="关闭知情人名单">×</button></div><div class="bioweave-character-alias-fields"><p class="bioweave-muted">已确认怀孕 · 知情人数 '+item.known.length+' 人</p><ul>'+item.known.map(name=>'<li>'+esc(name)+'</li>').join('')+'</ul></div><div class="bioweave-character-alias-actions"><span class="bioweave-muted">未列入名单的人默认不知道。</span></div></section>' }
      function addProjectionStatus(id) { const item=pregnancy[id], pane=main.querySelector('.bioweave-projection-detail'), meta=pane?.querySelector('.bioweave-projection-detail-meta'); if(!item||!meta)return; const first=meta.querySelector('.bioweave-badge'); if(!first)return; if(item.status==='confirmed'){first.outerHTML='<button type="button" class="bioweave-button bioweave-badge good" data-knowledge="'+id+'" aria-expanded="'+String(state.openKnowledge)+'" aria-controls="bioweave-pregnancy-knowledge-popover" aria-haspopup="dialog">已确认怀孕</button>'; if(state.openKnowledge) pane.querySelector('.bioweave-projection-detail-head')?.insertAdjacentHTML('afterend',knowledgePopoverMarkup(id,item))} else {first.textContent=item.label; first.className='bioweave-badge '+statusTone(item.status)} }
      function markup() { const analysisStatus={state:'success',current_floor:{floor:108},event_count:2,active_event_count:2,tracking_subject_count:3,current_floor_events:events,active_events:events,last_success:'刚刚'}; if(state.route==='overview')return overviewPage({trackingSubjects:subjects,activeEvents:events,chatName:'与剑灵们的双修日常',analysisStatus,projectionSummary:{active_count:1,recent:[{generated_statement:'柳如烟：初期观察路线仍在进行。'}]}}); if(state.route==='characters')return charactersPage({characterId:state.characterId,trackingSubjects:subjects,characterProfiles:profiles,activeEvents:events,analysisStatus,currentStateStatus:'ready',currentState:{characters:{}}}); if(state.route==='projection')return projectionPage({projections,projectionSummary:{active_count:1,observation_schedule:[{key:'stage_1',label:'初期观察',phase:'观察中',min_elapsed_story_days:0,max_elapsed_story_days:30,branches:[{key:'b1',label:'就医检查'}]}]},trackingSubjects:subjects,projectionSubjectId:state.projectionId,storylineSnapshots:snapshots}); return '<section class="bioweave-page"><div class="bioweave-card bioweave-empty"><b>'+routes.find(item=>item[0]===state.route)[1]+'</b><p>此预览只为核对真实生产 UI 外壳与页面导航，未改变该页面。</p></div></section>' }
      function render() { main.innerHTML=markup(); if(state.route==='characters')addCharacterState(state.characterId); if(state.route==='projection'){addProjectionStatus(state.projectionId)} document.querySelectorAll('[data-route]').forEach(button=>{button.classList.toggle('active',button.dataset.route===state.route);button.setAttribute('aria-current',button.dataset.route===state.route?'page':'false')}) }
      document.querySelector('.bioweave-route-items').innerHTML=routes.map(([id,label,icon])=>'<button type="button" class="bioweave-route-item" data-route="'+id+'"><i class="fa-solid '+icon+'" aria-hidden="true"></i><span>'+label+'</span></button>').join(''); render()
      document.addEventListener('click',event=>{const route=event.target.closest('[data-route]');if(route){event.preventDefault();state.route=route.dataset.route;state.openKnowledge=false;render();return}const character=event.target.closest('[data-character-id]');if(character&&state.route==='characters'){state.characterId=character.dataset.characterId;state.openKnowledge=false;render();return}const projection=event.target.closest('[data-projection-subject-id]');if(projection&&state.route==='projection'){state.projectionId=projection.dataset.projectionSubjectId;state.openKnowledge=false;render();return}if(state.openKnowledge&&!event.target.closest('#bioweave-pregnancy-knowledge-popover')&&!event.target.closest('[data-knowledge]')){state.openKnowledge=false;render();return}const knowledge=event.target.closest('[data-knowledge]');if(knowledge){state.openKnowledge=!state.openKnowledge;render()}})
      document.addEventListener('keydown',event=>{if(event.key==='Escape'&&state.openKnowledge){state.openKnowledge=false;render()}})
      document.querySelector('[data-bioweave-theme-button]').addEventListener('click',()=>{panel.dataset.theme={tavern:'light',light:'dark',dark:'tavern'}[panel.dataset.theme]||'tavern'})
    </script>
  </body>
</html>
