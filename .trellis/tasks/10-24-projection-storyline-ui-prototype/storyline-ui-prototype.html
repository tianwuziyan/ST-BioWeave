<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BioWeave · 推演页剧情支线原型</title>
  <style>
    :root {
      --bw-host: #0b1116;
      --bw-host-soft: #111a21;
      --bw-panel: #171f25;
      --bw-panel-raised: #1d272e;
      --bw-panel-soft: #202c34;
      --bw-text: #edf3f6;
      --bw-text-2: #c2cdd2;
      --bw-muted: #87959d;
      --bw-line: #33444e;
      --bw-line-soft: #293840;
      --bw-accent: #83c7ef;
      --bw-accent-soft: #203b4b;
      --bw-good: #7bd5ae;
      --bw-good-soft: #19372f;
      --bw-warn: #f1be72;
      --bw-warn-soft: #41331d;
      --bw-danger: #f08e98;
      --bw-danger-soft: #40262e;
      --bw-card: #1a252c;
      --bw-card-selected: #203744;
      --bw-radius: 10px;
      --bw-small-radius: 7px;
      --bw-shadow: 0 18px 50px rgba(0, 0, 0, .25);
      color-scheme: dark;
      font: 14px/1.5 system-ui, -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      overflow-x: hidden;
      background:
        radial-gradient(circle at 10% 0%, rgba(52, 106, 133, .16), transparent 32rem),
        var(--bw-host);
      color: var(--bw-text);
    }
    button { font: inherit; }
    button:focus-visible { outline: 2px solid var(--bw-accent); outline-offset: 2px; }
    .prototype-banner {
      position: sticky;
      top: 0;
      z-index: 5;
      padding: 6px 16px;
      border-bottom: 1px solid rgba(241, 190, 114, .28);
      background: rgba(65, 51, 29, .94);
      color: #f8d79e;
      font-size: 11px;
      letter-spacing: .03em;
      text-align: center;
    }
    .bioweave-panel {
      width: min(1120px, calc(100% - 24px));
      min-height: calc(100vh - 33px);
      margin: 12px auto;
      overflow: hidden;
      border: 1px solid #42545e;
      border-radius: 12px;
      background: var(--bw-panel);
      box-shadow: var(--bw-shadow);
    }
    .bioweave-app-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 50px;
      padding: 0 16px;
      background: #19232a;
    }
    .brand { display: flex; align-items: center; gap: 9px; }
    .brand-mark {
      display: grid;
      width: 27px;
      height: 27px;
      place-items: center;
      border: 1px solid #5f9cc0;
      border-radius: 50%;
      color: var(--bw-accent);
      font-size: 12px;
    }
    .brand strong { font-size: 14px; letter-spacing: .02em; }
    .brand span { color: var(--bw-muted); font-size: 11px; }
    .header-actions { display: flex; align-items: center; gap: 8px; }
    .icon-button, .control-button, .route-item, .person-card, .mode-button, .stop-button {
      border: 1px solid var(--bw-line);
      color: var(--bw-text-2);
      background: var(--bw-panel-raised);
      cursor: pointer;
      transition: border-color .16s ease, background .16s ease, color .16s ease, transform .16s ease;
    }
    .icon-button:hover, .control-button:hover, .route-item:hover, .person-card:hover,
    .mode-button:hover, .stop-button:hover { border-color: var(--bw-accent); color: var(--bw-text); }
    .icon-button { width: 32px; height: 32px; border-radius: 7px; }
    .routebar { padding: 0 12px; border-top: 1px solid rgba(255,255,255,.025); border-bottom: 1px solid var(--bw-line-soft); background: #141d23; }
    .route-items { display: grid; grid-template-columns: repeat(8, minmax(72px, 1fr)); gap: 3px; max-width: 760px; }
    .route-item { min-height: 42px; border: 0; border-bottom: 2px solid transparent; border-radius: 0; background: transparent; font-size: 13px; }
    .route-item.active { border-bottom-color: var(--bw-accent); color: var(--bw-accent); background: rgba(131, 199, 239, .07); }
    .main { padding: 20px; }
    .page-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin: 0 0 16px; }
    .eyebrow { margin: 0 0 3px; color: var(--bw-accent); font-size: 11px; letter-spacing: .11em; text-transform: uppercase; }
    h1, h2, h3, p { margin: 0; }
    h1 { font-size: 22px; line-height: 1.25; }
    h2 { font-size: 16px; }
    h3 { font-size: 14px; }
    .page-head p, .section-note { margin-top: 4px; color: var(--bw-muted); font-size: 12px; }
    .head-actions { display: flex; align-items: center; gap: 8px; }
    .control-button { min-height: 32px; padding: 5px 11px; border-radius: 7px; }
    .control-button.primary { border-color: #5f9cc0; background: var(--bw-accent-soft); color: var(--bw-accent); }
    .workspace { display: grid; grid-template-columns: minmax(205px, .34fr) minmax(0, 1fr); gap: 12px; align-items: start; }
    .surface { min-width: 0; border: 1px solid var(--bw-line-soft); border-radius: var(--bw-radius); background: var(--bw-panel-raised); }
    .pane-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; padding: 13px 14px 9px; }
    .pane-head small { color: var(--bw-muted); font-size: 11px; }
    .people-list { display: grid; gap: 6px; padding: 0 8px 9px; }
    .person-card { display: grid; gap: 7px; width: 100%; padding: 11px 12px; border-radius: 8px; text-align: left; }
    .person-card.selected { border-color: var(--bw-accent); background: var(--bw-card-selected); }
    .person-top, .person-meta, .section-head, .route-card-top, .route-meta, .selected-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .person-top strong { font-size: 14px; }
    .person-top span { color: var(--bw-muted); font-size: 12px; }
    .person-meta { color: var(--bw-muted); font-size: 11px; }
    .progress { height: 4px; overflow: hidden; border-radius: 99px; background: #10181d; }
    .progress span { display: block; width: 58%; height: 100%; border-radius: inherit; background: var(--bw-accent); }
    .progress.high span { width: 78%; background: var(--bw-warn); }
    .badge { display: inline-flex; align-items: center; min-height: 20px; padding: 1px 7px; border: 1px solid transparent; border-radius: 99px; font-size: 10px; white-space: nowrap; }
    .badge.accent { border-color: #4c809f; background: var(--bw-accent-soft); color: var(--bw-accent); }
    .badge.good { border-color: #38765f; background: var(--bw-good-soft); color: var(--bw-good); }
    .badge.warn { border-color: #8b6b36; background: var(--bw-warn-soft); color: var(--bw-warn); }
    .badge.muted { border-color: var(--bw-line); background: #172128; color: var(--bw-muted); }
    .detail { padding: 14px; }
    .detail-head { padding-bottom: 14px; border-bottom: 1px solid var(--bw-line); }
    .detail-head h2 { font-size: 18px; }
    .detail-head p { margin-top: 3px; color: var(--bw-muted); font-size: 12px; }
    .detail-head .badge { margin-left: auto; }
    .summary-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 7px; margin-top: 12px; }
    .summary-cell { padding: 9px 10px; border: 1px solid var(--bw-line-soft); border-radius: 8px; background: var(--bw-card); }
    .summary-cell span { display: block; color: var(--bw-muted); font-size: 10px; }
    .summary-cell strong { display: block; margin-top: 2px; font-size: 13px; }
    .summary-cell strong.good { color: var(--bw-good); }
    .section { margin-top: 15px; }
    .section-head { align-items: flex-end; margin-bottom: 8px; }
    .section-head h3 { color: var(--bw-text-2); }
    .section-head p { color: var(--bw-muted); font-size: 11px; }
    .signal-row { display: flex; flex-wrap: wrap; gap: 6px; }
    .signal { padding: 5px 9px; border: 1px solid #38765f; border-radius: 7px; background: var(--bw-good-soft); color: var(--bw-good); font-size: 12px; }
    .callout { display: flex; gap: 9px; padding: 10px 11px; border: 1px solid #3d5967; border-radius: 8px; background: #172832; color: var(--bw-text-2); font-size: 12px; }
    .callout-icon { color: var(--bw-accent); font-size: 15px; }
    .routes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
    .route-card { display: grid; gap: 10px; min-width: 0; padding: 12px; border: 1px solid var(--bw-line-soft); border-radius: 8px; background: var(--bw-card); }
    .route-card:hover { border-color: #5f8497; transform: translateY(-1px); }
    .route-card-top { align-items: flex-start; }
    .route-card-top strong { font-size: 14px; line-height: 1.35; }
    .route-index { display: grid; flex: 0 0 auto; width: 25px; height: 25px; place-items: center; border: 1px solid #4b7892; border-radius: 7px; background: var(--bw-accent-soft); color: var(--bw-accent); font-size: 11px; }
    .route-card p { color: var(--bw-text-2); font-size: 12px; }
    .route-label { color: var(--bw-muted); font-size: 10px; }
    .node-preview { display: grid; gap: 5px; padding-top: 8px; border-top: 1px solid var(--bw-line-soft); }
    .node-preview li { position: relative; padding-left: 15px; color: var(--bw-muted); font-size: 11px; list-style: none; }
    .node-preview li::before { position: absolute; top: 7px; left: 1px; width: 5px; height: 5px; border-radius: 50%; background: var(--bw-accent); content: ""; }
    .goal { padding: 8px 9px; border-left: 2px solid var(--bw-warn); background: rgba(65, 51, 29, .32); color: #edcf9e; font-size: 11px; }
    .selected-route { padding: 13px; border: 1px solid #5f9cc0; border-radius: 9px; background: linear-gradient(135deg, #203744, #1b2c35); }
    .selected-head { align-items: flex-start; }
    .selected-head strong { font-size: 16px; }
    .selected-head p { margin-top: 3px; color: var(--bw-text-2); font-size: 12px; }
    .timeline { display: grid; gap: 0; margin: 15px 0 0 6px; }
    .timeline-item { position: relative; display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 9px; min-height: 65px; }
    .timeline-item::before { position: absolute; top: 18px; bottom: -1px; left: 7px; width: 1px; background: #46606d; content: ""; }
    .timeline-item:last-child::before { display: none; }
    .timeline-dot { position: relative; z-index: 1; width: 15px; height: 15px; margin-top: 2px; border: 3px solid #203744; border-radius: 50%; background: var(--bw-accent); box-shadow: 0 0 0 1px var(--bw-accent); }
    .timeline-item.done .timeline-dot { background: var(--bw-good); box-shadow: 0 0 0 1px var(--bw-good); }
    .timeline-item.current .timeline-dot { background: var(--bw-warn); box-shadow: 0 0 0 1px var(--bw-warn), 0 0 0 5px rgba(241,190,114,.1); }
    .timeline-copy { padding-bottom: 14px; }
    .timeline-copy strong { font-size: 13px; }
    .timeline-copy p { margin-top: 2px; color: var(--bw-text-2); font-size: 11px; }
    .state-box { display: grid; justify-items: center; gap: 9px; padding: 42px 20px; border: 1px dashed #4a5d67; border-radius: 9px; background: var(--bw-card); text-align: center; }
    .state-icon { display: grid; width: 42px; height: 42px; place-items: center; border: 1px solid #4c809f; border-radius: 50%; color: var(--bw-accent); font-size: 19px; }
    .state-box strong { font-size: 15px; }
    .state-box p { max-width: 420px; color: var(--bw-muted); font-size: 12px; }
    .spinner { width: 17px; height: 17px; border: 2px solid #3b5360; border-top-color: var(--bw-accent); border-radius: 50%; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .stop-button { min-height: 32px; padding: 5px 12px; border-color: #774852; border-radius: 7px; background: var(--bw-danger-soft); color: var(--bw-danger); }
    .prototype-controls { display: flex; flex-wrap: wrap; align-items: center; gap: 7px; margin-top: 18px; padding: 11px; border: 1px solid var(--bw-line-soft); border-radius: 8px; background: #141d23; }
    .prototype-controls > span { margin-right: 3px; color: var(--bw-muted); font-size: 11px; }
    .mode-button { min-height: 30px; padding: 4px 9px; border-radius: 6px; font-size: 11px; }
    .mode-button.active { border-color: var(--bw-accent); background: var(--bw-accent-soft); color: var(--bw-accent); }
    .footnote { margin-top: 9px; color: var(--bw-muted); font-size: 10px; text-align: right; }
    @media (max-width: 900px) {
      .routes { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .routes .route-card:last-child { grid-column: 1 / -1; }
    }
    @media (max-width: 767px) {
      .bioweave-panel { width: 100%; margin: 0; border-right: 0; border-left: 0; border-radius: 0; }
      .bioweave-app-header { padding: 0 12px; }
      .brand span { display: none; }
      .routebar { padding: 0 8px; }
      .route-items { grid-template-columns: repeat(4, 1fr); }
      .route-item { min-width: 0; min-height: 38px; font-size: 13px; }
      .main { padding: 14px 11px 18px; }
      .page-head { display: block; }
      .head-actions { margin-top: 10px; }
      .workspace { grid-template-columns: 1fr; }
      .people-list { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .person-card { min-height: 95px; }
      .detail { padding: 12px; }
      .summary-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .routes { grid-template-columns: 1fr; }
      .routes .route-card:last-child { grid-column: auto; }
      .section-head { display: block; }
      .section-head p { margin-top: 2px; }
      .footnote { text-align: left; }
    }
    @media (max-width: 420px) {
      .summary-grid { grid-template-columns: 1fr; }
      .summary-cell { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
      .summary-cell strong { margin-top: 0; }
      .head-actions { justify-content: space-between; }
      .head-actions .badge { flex: 1; }
    }
  </style>
</head>
<body>
  <div class="prototype-banner">PROTOTYPE — 用完即删 · 仅用于确认推演 API 返回结果在 UI 中的展示方式</div>
  <section class="bioweave-panel" aria-label="BioWeave 推演页原型">
    <header class="bioweave-app-header">
      <div class="brand"><span class="brand-mark" aria-hidden="true">✦</span><strong>BioWeave</strong><span>生物观测与剧情推演</span></div>
      <div class="header-actions"><span class="badge muted">静态原型</span><button class="icon-button" type="button" aria-label="主题：跟随酒馆" title="主题：跟随酒馆">◐</button></div>
    </header>
    <nav class="routebar" aria-label="BioWeave 页面导航">
      <div class="route-items">
        <button class="route-item" type="button">总览</button><button class="route-item" type="button">人物</button><button class="route-item" type="button">事件</button><button class="route-item active" type="button" aria-current="page">推演</button><button class="route-item" type="button">家系</button><button class="route-item" type="button">世界</button><button class="route-item" type="button">设置</button><button class="route-item" type="button">状态</button>
      </div>
    </nav>
    <main class="main">
      <header class="page-head">
        <div><p class="eyebrow">人物推演 · 剧情支线</p><h1>人物推演</h1><p>先选人物，再查看这个人物自己的潜在剧情时间线</p></div>
        <div class="head-actions"><span class="badge accent">API 已返回 · 3 条候选路线</span><button class="control-button" type="button">重新读取</button></div>
      </header>
      <div class="workspace">
        <aside class="surface" aria-label="观察人物列表">
          <div class="pane-head"><h2>观察人物</h2><small>3 人</small></div>
          <div class="people-list">
            <button class="person-card selected" type="button"><div class="person-top"><strong>柳如烟</strong><span class="badge good">已触发</span></div><div class="person-meta"><span>第 21–27 天 · 观察中</span><span>3 条路线</span></div><div class="progress"><span></span></div></button>
            <button class="person-card" type="button"><div class="person-top"><strong>祁鸢</strong><span class="badge warn">待观察</span></div><div class="person-meta"><span>第 14–20 天 · 观察中</span><span>无路线</span></div><div class="progress high"><span></span></div></button>
            <button class="person-card" type="button"><div class="person-top"><strong>觉心</strong><span class="badge muted">未触发</span></div><div class="person-meta"><span>第 28–42 天 · 观察中</span><span>等待正文</span></div><div class="progress"><span style="width: 34%"></span></div></button>
          </div>
        </aside>
        <section class="surface detail" aria-live="polite">
          <header class="detail-head"><div class="selected-head"><div><h2>柳如烟</h2><p>本轮观察窗口 · 目标人物的潜在剧情会在正文中逐步创造条件</p></div><span class="badge good">观察中</span></div><div class="summary-grid"><div class="summary-cell"><span>当前阶段</span><strong>第 21–27 天</strong></div><div class="summary-cell"><span>已触发生理信号</span><strong class="good">2 项</strong></div><div class="summary-cell"><span>剧情状态</span><strong id="summary-status">候选路线</strong></div></div></header>
          <div id="storyline-content"></div>
          <div class="prototype-controls" aria-label="原型状态切换"><span>原型状态：</span><button class="mode-button active" type="button" data-mode="candidates">候选路线</button><button class="mode-button" type="button" data-mode="selected">已选支线</button><button class="mode-button" type="button" data-mode="running">生成中</button><button class="mode-button" type="button" data-mode="terminated">已结束 / 空状态</button></div>
          <p class="footnote">以下内容为 API 返回的剧情设计建议，不代表已经发生的事实；本原型不调用 API，也不写入 Floor。</p>
        </section>
      </div>
    </main>
  </section>
  <script>
    // PROTOTYPE ONLY: all state and example data live in memory and disappear on reload.
    const branches = [
      {
        title: '以肠胃不适为由就医',
        premise: '柳如烟连续几日食欲变化、恶心，误以为是饮食不洁或旧疾反复。',
        nodes: ['症状在日常中变得难以忽略', '身边人提出去医馆检查', '大夫问诊并安排常规检查'],
        goal: '在常规检查过程中自然发现异常，再决定是否进入确认。'
      },
      {
        title: '突发事故后的例行检查',
        premise: '一次轻微意外让她不得不进医院，检查重点原本并不在生殖相关。',
        nodes: ['事故造成短暂不适', '急诊先处理外伤或腹部不适', '检查结果带出意外线索'],
        goal: '让意外检查成为信息入口，而不是直接让角色得出结论。'
      },
      {
        title: '大夫从脉象察觉异常',
        premise: '她因乏力、恶心寻求调理，大夫从问诊和摸脉中发现需要进一步确认的迹象。',
        nodes: ['以疲倦或食欲不振求诊', '大夫问询周期与近期变化', '摸脉后建议做进一步检查'],
        goal: '先保留疑问与行动空间，直到后续检查明确结果。'
      }
    ];

    const content = document.querySelector('#storyline-content');
    const status = document.querySelector('#summary-status');
    const buttons = [...document.querySelectorAll('[data-mode]')];

    function branchCard(branch, index) {
      return `<article class="route-card"><div class="route-card-top"><strong>${index + 1}. ${branch.title}</strong><span class="route-index">路线</span></div><p>${branch.premise}</p><div><span class="route-label">推进节点 · ${branch.nodes.length} 步</span><ul class="node-preview">${branch.nodes.map(node => `<li>${node}</li>`).join('')}</ul></div><div class="goal"><span class="route-label">结论目标</span><br>${branch.goal}</div></article>`;
    }

    function render(mode) {
      buttons.forEach(button => button.classList.toggle('active', button.dataset.mode === mode));
      if (mode === 'candidates') {
        status.textContent = '候选路线';
        content.innerHTML = `<section class="section"><div class="section-head"><div><h3>候选剧情支线</h3><p>API 已返回 3 条设计建议 · 候选，不是已发生事实</p></div><span class="badge accent">等待正文推进</span></div><div class="callout"><span class="callout-icon">✦</span><span>下一次正文生成时，引导 AI 从这些候选中推进一条支线；一旦选定，其他路线不再同时推进。</span></div><div class="routes" style="margin-top: 9px">${branches.map(branchCard).join('')}</div></section><section class="section"><div class="section-head"><div><h3>已触发生理信号</h3><p>这些信号只用于创造自然的剧情契机，不等同于怀孕结论</p></div></div><div class="signal-row"><span class="signal">食欲变化</span><span class="signal">恶心</span></div></section>`;
      } else if (mode === 'selected') {
        status.textContent = '已选支线';
        const branch = branches[0];
        content.innerHTML = `<section class="section"><div class="section-head"><div><h3>当前推进支线</h3><p>已选定后只注入这一条路线，直到完成或明确不成立</p></div><span class="badge good">进行中</span></div><article class="selected-route"><div class="selected-head"><div><strong>${branch.title}</strong><p>${branch.premise}</p></div><span class="badge accent">单线推进</span></div><div class="timeline">${branch.nodes.map((node, index) => `<div class="timeline-item ${index === 0 ? 'done' : index === 1 ? 'current' : ''}"><span class="timeline-dot" aria-hidden="true"></span><div class="timeline-copy"><strong>${index === 0 ? '已发生 · ' : index === 1 ? '当前目标 · ' : '下一节点 · '}${node}</strong><p>${index === 1 ? '正文生成时应主动创造能够推进此节点的条件。' : index === 2 ? '完成后再判断是否进入最终确认。' : '已由当前正文建立。'}</p></div></div>`).join('')}</div><div class="goal"><span class="route-label">最终结论目标</span><br>${branch.goal}</div></article></section>`;
      } else if (mode === 'running') {
        status.textContent = '生成中';
        content.innerHTML = `<section class="section"><div class="state-box"><span class="spinner" aria-hidden="true"></span><strong>正在生成候选路线…</strong><p>正在将已触发生理信号、人物资料和近期正文发送给推演 API，返回后会在这里显示事件支线。</p><button class="stop-button" type="button" id="stop-generation">停止生成</button></div></section>`;
        document.querySelector('#stop-generation').addEventListener('click', () => render('candidates'));
      } else {
        status.textContent = '本轮已结束';
        content.innerHTML = `<section class="section"><div class="state-box"><span class="state-icon" aria-hidden="true">✓</span><strong>本轮剧情支线已结束</strong><p>当前观察窗口没有可继续推进的候选路线。后续如进入新的观察周期，将生成新的事件内容。</p><span class="badge muted">无可用支线</span></div></section>`;
      }
    }

    buttons.forEach(button => button.addEventListener('click', () => render(button.dataset.mode)));
    render('candidates');
  </script>
</body>
</html>
